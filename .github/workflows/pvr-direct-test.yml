
name: Test Cloudflare PVR proxy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test PVR through Cloudflare
        env:
          PVR_PROXY_BASE: ${{ secrets.PVR_PROXY_BASE }}
          PVR_PROXY_TOKEN: ${{ secrets.PVR_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import os

          url = os.environ["PVR_PROXY_BASE"].rstrip("/") + "/proxy/content/city"
          body = json.dumps({
              "lat": "13.0827",
              "lng": "80.2707"
          }).encode()

          req = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "pvr-seat-alerts/1.0",
                  "x-proxy-token": os.environ["PVR_PROXY_TOKEN"],
                  "x-city": "Chennai"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("HTTP STATUS:", r.status)
                  print("RESPONSE:", r.read().decode()[:1500])
          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code)
              print("RESPONSE:", e.read().decode()[:1500])
              raise
          PY
