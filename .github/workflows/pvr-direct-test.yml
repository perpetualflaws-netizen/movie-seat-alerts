
name: Test direct PVR access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test PVR without proxy
        env:
          PVR_PROXY_BASE: ""
          PVR_PROXY_TOKEN: ""
        run: |
          python - <<'PY'
          import core
          import traceback

          date = core.today_ist().isoformat()
          body = {
              "city": "Chennai",
              "cid": "320",
              "lat": "12.99193469",
              "lng": "80.21682184",
              "dated": date,
              "qr": "NO",
              "cineType": "",
              "cineTypeQR": ""
          }

          try:
              result = core._post("content/csessions", body, "Chennai")
              print("DIRECT ACCESS SUCCESS")
              print("API status:", result.get("status"))
              print("Response received.")
          except Exception as e:
              print("DIRECT ACCESS FAILED")
              print(type(e).__name__, str(e))
              raise
          PY
