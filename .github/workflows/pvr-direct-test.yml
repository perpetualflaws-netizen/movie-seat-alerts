
name: Test Cloudflare PVR proxy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Cloudflare proxy
        env:
          PVR_PROXY_BASE: ${{ secrets.PVR_PROXY_BASE }}
          PVR_PROXY_TOKEN: ${{ secrets.PVR_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import os

          url = os.environ["PVR_PROXY_BASE"].rstrip("/") + "/proxy/content/city"
          body = json.dumps({
              "lat": "13.0827",
              "lng": "80.2707"
          }).encode()

          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "x-proxy-token": os.environ["PVR_PROXY_TOKEN"],
                  "x-city": "Chennai"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print("HTTP STATUS:", response.status)
                  data = json.loads(response.read())
                  print("PVR RESPONSE STATUS:", data.get("status"))
                  print("PVR RESPONSE MESSAGE:", data.get("msg"))
                  print("SUCCESS: Cloudflare reached PVR.")
          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code)
              print("RESPONSE:", e.read().decode()[:1000])
              raise
          PY
