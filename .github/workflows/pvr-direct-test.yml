
name: Test Cloudflare connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Worker GET
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://pvr-seat-proxy.perpetualflaws.workers.dev/"
          req = urllib.request.Request(
              url,
              method="GET",
              headers={
                  "User-Agent": "pvr-seat-alerts/1.0 (+https://github.com/perpetualflaws-netizen/movie-seat-alerts)"
              }
              )

          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("STATUS:", r.status)
                  print("BODY:", r.read().decode())
          except Exception as e:
              print("FAILED:", repr(e))
              raise
          PY
